name: Update ETF Price

on:
  schedule:
    # 09:07–16:52 KST, weekdays; about every 15 minutes.
    - cron: "7,22,37,52 0-7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: stock-monitor-update
  cancel-in-progress: false

jobs:
  update-etf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests python-dotenv firebase-admin yfinance

      - name: Create Firebase service key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_KEY }}' > firebase-service-key.json

      - name: Run ETF updater
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python kis-update-etf.py

      - name: Run component stocks updater
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python update-component-stocks.py

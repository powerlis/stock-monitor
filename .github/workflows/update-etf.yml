name: Update ETF Price

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  update-etf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install \
            requests==2.32.5 \
            python-dotenv==1.1.1 \
            firebase-admin==7.1.0 \
            google-cloud-firestore==2.21.0 \
            yfinance==0.2.65

      - name: Create Firebase service key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_KEY }}' > firebase-service-key.json

      - name: Run ETF updater
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python kis-update-etf.py

      - name: Run component stocks updater
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python update-component-stocks.py
